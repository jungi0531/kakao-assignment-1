<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">

    <!-- 앱 헤더 -->
    <header class="app-header">
      <h1 class="app-title">My Tasks</h1>
      <p class="app-subtitle">오늘 할 일을 관리해보세요</p>
    </header>

    <main class="app-main">

      <!-- 주간 뷰 -->
      <section class="week-nav" aria-label="주간 뷰">
        <div class="week-nav-header">
          <button id="prev-week-btn" class="week-nav-btn" aria-label="이전 주">&#8249;</button>
          <div class="week-range-display">
            <span id="week-range-text" class="week-range-text"></span>
            <!--
              현재 주일 때는 숨기고, 다른 주를 보고 있을 때만
              JS로 is-visible 클래스를 추가해 표시한다
            -->
            <button type="button" id="current-week-btn" class="current-week-btn">이번 주로 이동</button>
          </div>
          <button id="next-week-btn" class="week-nav-btn" aria-label="다음 주">&#8250;</button>
        </div>
        <!-- 날짜 셀(월 ~ 일)은 JS로 동적 생성 -->
        <div id="week-grid" class="week-grid" role="group" aria-label="날짜 선택"></div>
      </section>

      <!-- 입력 영역 -->
      <section class="input-section" aria-label="할 일 추가">
        <div class="input-wrapper">
          <input
            type="text"
            id="todo-input"
            class="todo-input"
            placeholder="할 일을 입력하세요..."
            aria-label="할 일 입력"
            maxlength="100"
          />
          <button id="add-btn" class="add-btn" aria-label="할 일 추가">
            추가
          </button>
        </div>
        <!-- 유효성 검사 안내 메시지 (빈 입력 시 표시) -->
        <p id="error-msg" class="error-msg" role="alert" aria-live="polite"></p>
      </section>

      <!-- 필터 탭 -->
      <section class="filter-section" aria-label="필터">
        <div class="filter-tabs" role="tablist" aria-label="할 일 상태 필터">
          <button class="filter-tab is-active" data-filter="all"       role="tab" aria-selected="true">전체</button>
          <button class="filter-tab"            data-filter="active"    role="tab" aria-selected="false">진행 중</button>
          <button class="filter-tab"            data-filter="completed" role="tab" aria-selected="false">완료</button>
        </div>
      </section>

      <!-- 진행 통계 -->
      <section class="stats-section" aria-label="진행 상황">
        <span id="stats-text" class="stats-text"></span>
      </section>

      <!-- Todo 목록 -->
      <section class="list-section" aria-label="할 일 목록">
        <ul id="todo-list" class="todo-list"></ul>
        <!-- 항목이 없을 때 표시되는 빈 상태 -->
        <div id="empty-state" class="empty-state">
          <p id="empty-msg">할 일이 없습니다.<br />새로운 할 일을 추가해보세요!</p>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
